<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4ed">
    <meta name="description" content="深情俱乐部">
    <meta property="og:title" content="深情俱乐部">
    <meta property="og:type" content="website">
    <title>深情俱乐部</title>
    <link rel="stylesheet" href="main.css?v=5">
    <link rel="stylesheet" href="zhao-game.css?v=2">
    <script src="main.js?v=5" defer></script>
    <script src="zhao-game.js?v=2" type="module"></script>
  </head>
  <body class="session-loading">
    <main class="app-shell" aria-label="深情俱乐部主界面">
      <section class="app-view is-active" id="entertainmentView" data-view="entertainment" aria-labelledby="entertainmentTitle">
        <header class="view-header">
          <div>
            <p>PLAYGROUND</p>
            <h1 id="entertainmentTitle">娱乐</h1>
          </div>
        </header>

        <div class="entertainment-content">
          <button class="game-launcher" id="openZhaoGame" type="button" aria-label="打开赵云与阿斗">
            <span class="game-icon-crop">
              <img src="assets/zhao-yun-a-dou-icon-v2.png" alt="" width="720" height="720">
            </span>
            <span>赵云与阿斗</span>
          </button>
        </div>
      </section>

      <section class="app-view" id="friendsView" data-view="friends" aria-labelledby="friendsTitle" hidden>
        <header class="view-header friends-header">
          <div>
            <p>CONNECTIONS</p>
            <h1 id="friendsTitle">好友</h1>
          </div>
          <span class="friend-count">3 位好友</span>
        </header>

        <div class="friends-content">
          <label class="search-box" for="friendSearch">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            <input id="friendSearch" type="search" placeholder="搜索好友" autocomplete="off">
          </label>

          <div class="friend-section-heading">
            <h2>所有好友</h2>
            <span id="visibleFriendCount">3</span>
          </div>

          <ul class="friend-list" id="friendList">
            <li class="friend-row" data-friend="晚风">
              <div class="friend-avatar avatar-coral" aria-hidden="true">晚</div>
              <div class="friend-info">
                <strong>晚风</strong>
                <span><i class="presence is-online"></i>在线</span>
              </div>
              <button class="message-button" type="button" aria-label="给晚风发消息" title="发消息">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
              </button>
            </li>
            <li class="friend-row" data-friend="小满">
              <div class="friend-avatar avatar-olive" aria-hidden="true">满</div>
              <div class="friend-info">
                <strong>小满</strong>
                <span><i class="presence is-online"></i>在线</span>
              </div>
              <button class="message-button" type="button" aria-label="给小满发消息" title="发消息">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
              </button>
            </li>
            <li class="friend-row" data-friend="长街">
              <div class="friend-avatar avatar-blue" aria-hidden="true">长</div>
              <div class="friend-info">
                <strong>长街</strong>
                <span><i class="presence"></i>2 小时前在线</span>
              </div>
              <button class="message-button" type="button" aria-label="给长街发消息" title="发消息">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
              </button>
            </li>
          </ul>

          <p class="empty-friends" id="emptyFriends" hidden>没有找到这个好友</p>
        </div>
      </section>

      <section class="app-view" id="profileView" data-view="profile" aria-labelledby="profileTitle" hidden>
        <header class="view-header profile-title-row">
          <p>ACCOUNT</p>
          <h1 id="profileTitle">我的</h1>
        </header>

        <div class="profile-content">
          <section class="profile-identity" aria-label="账号资料">
            <div class="profile-avatar" id="profileAvatar" aria-hidden="true">深</div>
            <div>
              <h2 id="profileUsername">加载中</h2>
              <p>深情俱乐部成员</p>
            </div>
          </section>

          <section class="profile-section" aria-labelledby="accountHeading">
            <h2 id="accountHeading">账号</h2>
            <dl class="account-details">
              <div>
                <dt>用户名</dt>
                <dd id="accountUsername">-</dd>
              </div>
              <div>
                <dt>账号状态</dt>
                <dd><span class="status-dot"></span>正常</dd>
              </div>
            </dl>
          </section>

          <section class="profile-section" aria-labelledby="settingsHeading">
            <h2 id="settingsHeading">设置</h2>
            <button class="settings-row" type="button" id="logoutButton">
              <span class="settings-icon">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></svg>
              </span>
              <span>退出登录</span>
              <svg class="row-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </section>

          <p class="profile-footnote">深情.club · 2026</p>
        </div>
      </section>

      <nav class="bottom-navigation" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-target="entertainment" aria-controls="entertainmentView" aria-current="page">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h4"></path><path d="M8 10v4"></path><path d="M15 13h.01"></path><path d="M18 11h.01"></path><path d="M7.5 5h9A4.5 4.5 0 0 1 21 9.5v5a3.5 3.5 0 0 1-6.1 2.35L13 15H11l-1.9 1.85A3.5 3.5 0 0 1 3 14.5v-5A4.5 4.5 0 0 1 7.5 5z"></path></svg>
          <span>娱乐</span>
        </button>
        <button class="nav-item" type="button" data-target="friends" aria-controls="friendsView">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>好友</span>
        </button>
        <button class="nav-item" type="button" data-target="profile" aria-controls="profileView">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>我的</span>
        </button>
      </nav>

      <p class="app-toast" id="appToast" role="status" aria-live="polite"></p>
    </main>

    <section class="zhao-game" id="zhaoGame" aria-label="赵云与阿斗游戏" hidden>
      <div class="zy-game-shell" id="zyGameShell"></div>
      <p class="zy-live" id="zyLive" role="status" aria-live="polite"></p>
    </section>
  </body>
</html>
