<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4ed">
    <meta name="description" content="深情俱乐部">
    <meta property="og:title" content="深情俱乐部">
    <meta property="og:type" content="website">
    <title>深情俱乐部</title>
    <link rel="stylesheet" href="main.css?v=7">
    <link rel="stylesheet" href="zhao-game.css?v=2">
    <script src="main.js?v=7" defer></script>
    <script src="zhao-game.js?v=2" type="module"></script>
  </head>
  <body class="session-loading">
    <main class="app-shell" aria-label="深情俱乐部主界面">
      <section class="app-view is-active" id="entertainmentView" data-view="entertainment" aria-labelledby="entertainmentTitle">
        <header class="view-header">
          <div>
            <p>PLAYGROUND</p>
            <h1 id="entertainmentTitle">娱乐</h1>
          </div>
        </header>

        <div class="entertainment-content">
          <button class="game-launcher" id="openZhaoGame" type="button" aria-label="打开赵云与阿斗">
            <span class="game-icon-crop">
              <img src="assets/zhao-yun-a-dou-icon-v2.png" alt="" width="720" height="720">
            </span>
            <span>赵云与阿斗</span>
          </button>
        </div>
      </section>

      <section class="app-view" id="friendsView" data-view="friends" aria-labelledby="friendsTitle" hidden>
        <header class="view-header friends-header">
          <div>
            <p>CONNECTIONS</p>
            <h1 id="friendsTitle">好友</h1>
          </div>
          <span class="friend-count">3 位好友</span>
        </header>

        <div class="friends-content">
          <label class="search-box" for="friendSearch">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            <input id="friendSearch" type="search" placeholder="搜索好友" autocomplete="off">
          </label>

          <div class="friend-section-heading">
            <h2>所有好友</h2>
            <span id="visibleFriendCount">3</span>
          </div>

          <ul class="friend-list" id="friendList">
            <li class="friend-row" data-friend="晚风">
              <div class="friend-avatar avatar-coral" aria-hidden="true">晚</div>
              <div class="friend-info">
                <strong>晚风</strong>
                <span><i class="presence is-online"></i>在线</span>
              </div>
              <button class="message-button" type="button" aria-label="给晚风发消息" title="发消息">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
              </button>
            </li>
            <li class="friend-row" data-friend="小满">
              <div class="friend-avatar avatar-olive" aria-hidden="true">满</div>
              <div class="friend-info">
                <strong>小满</strong>
                <span><i class="presence is-online"></i>在线</span>
              </div>
              <button class="message-button" type="button" aria-label="给小满发消息" title="发消息">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
              </button>
            </li>
            <li class="friend-row" data-friend="长街">
              <div class="friend-avatar avatar-blue" aria-hidden="true">长</div>
              <div class="friend-info">
                <strong>长街</strong>
                <span><i class="presence"></i>2 小时前在线</span>
              </div>
              <button class="message-button" type="button" aria-label="给长街发消息" title="发消息">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
              </button>
            </li>
          </ul>

          <p class="empty-friends" id="emptyFriends" hidden>没有找到这个好友</p>
        </div>
      </section>

      <section class="app-view" id="profileView" data-view="profile" aria-labelledby="profileTitle" hidden>
        <header class="view-header">
          <div>
            <p>ACCOUNT</p>
            <h1 id="profileTitle">我的</h1>
          </div>
          <button class="header-icon-button" id="openSettings" type="button" aria-label="打开设置" title="设置">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.08V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.08-.4H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6A1.65 1.65 0 0 0 10.4 3V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.24.36.6.6 1 .6h.1a2 2 0 1 1 0 4h-.1a1.65 1.65 0 0 0-1 .6z"></path></svg>
          </button>
        </header>

        <div class="profile-content">
          <section class="profile-identity" aria-label="账号资料">
            <div class="profile-avatar" id="profileAvatar" aria-hidden="true">深</div>
            <div class="profile-identity-main">
              <h2 id="profileNickname">加载中</h2>
              <p id="profileSignature">这个人很深情，还没留下签名。</p>
            </div>
            <span class="member-badge" id="memberLevel">V1</span>
          </section>

          <section class="profile-section" aria-labelledby="accountHeading">
            <h2 id="accountHeading">账号</h2>
            <dl class="account-details">
              <div>
                <dt>账号</dt>
                <dd id="accountUsername">-</dd>
              </div>
              <div>
                <dt>绑定邮箱</dt>
                <dd id="accountEmail">-</dd>
              </div>
              <div>
                <dt>在线时长</dt>
                <dd id="activeTime">0 分钟</dd>
              </div>
              <div>
                <dt>账号状态</dt>
                <dd><span class="status-dot"></span>正常</dd>
              </div>
            </dl>
          </section>

          <section class="profile-section" aria-labelledby="settingsHeading">
            <h2 id="settingsHeading">设置</h2>
            <button class="settings-row" type="button" id="openSettingsRow">
              <span class="settings-icon">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.08V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.08-.4H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6A1.65 1.65 0 0 0 10.4 3V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.24.36.6.6 1 .6h.1a2 2 0 1 1 0 4h-.1a1.65 1.65 0 0 0-1 .6z"></path></svg>
              </span>
              <span>账号与隐私</span>
              <svg class="row-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </section>

          <p class="profile-footnote">深情.club · 2026</p>
        </div>
      </section>

      <section class="app-view" id="settingsView" data-view="settings" aria-labelledby="settingsTitle" hidden>
        <header class="view-header settings-page-header">
          <button class="back-button" type="button" id="backFromSettings" aria-label="返回我的">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
            <span>返回</span>
          </button>
          <div>
            <p>SETTINGS</p>
            <h1 id="settingsTitle">设置</h1>
          </div>
        </header>

        <div class="settings-content">
          <section class="settings-section" aria-labelledby="profileEditTitle">
            <h2 id="profileEditTitle">个人信息</h2>
            <form class="settings-panel" id="profileEdit">
              <label>
                <span>头像字</span>
                <input id="editAvatarText" name="avatarText" maxlength="4" placeholder="深">
              </label>
              <label>
                <span>昵称</span>
                <input id="editNickname" name="nickname" maxlength="24" required>
              </label>
              <label>
                <span>个性签名</span>
                <textarea id="editSignature" name="signature" maxlength="80" rows="3"></textarea>
              </label>
              <p class="settings-message" id="profileEditMessage" aria-live="polite"></p>
              <button class="primary-action" type="submit">保存资料</button>
            </form>
          </section>

          <section class="settings-section" aria-labelledby="feedbackTitle">
            <h2 id="feedbackTitle">意见反馈</h2>
            <form class="settings-panel" id="feedbackPanel">
              <label>
                <span>联系方式</span>
                <input id="feedbackContact" name="contact" maxlength="120" placeholder="邮箱或微信，可不填">
              </label>
              <label>
                <span>反馈内容</span>
                <textarea id="feedbackMessage" name="message" maxlength="1000" rows="5" required placeholder="哪里不好用、想加什么，都可以写在这里。"></textarea>
              </label>
              <p class="settings-message" id="feedbackStatus" aria-live="polite"></p>
              <button class="primary-action" type="submit">发送反馈</button>
            </form>
          </section>

          <section class="settings-section security-panel" aria-labelledby="securityTitle">
            <h2 id="securityTitle">账号安全</h2>
            <form id="passwordForm">
              <h3>修改密码</h3>
              <label>
                <span>当前密码</span>
                <input name="currentPassword" type="password" autocomplete="current-password" required>
              </label>
              <label>
                <span>新密码</span>
                <input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
              </label>
              <label>
                <span>确认新密码</span>
                <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
              </label>
              <p class="settings-message" id="passwordStatus" aria-live="polite"></p>
              <button class="primary-action" type="submit">更新密码</button>
            </form>

            <form id="emailForm">
              <h3>修改邮箱</h3>
              <label>
                <span>新邮箱</span>
                <input name="email" type="email" autocomplete="email" required>
              </label>
              <label>
                <span>当前密码</span>
                <input name="currentPassword" type="password" autocomplete="current-password" required>
              </label>
              <p class="settings-message" id="emailStatus" aria-live="polite"></p>
              <button class="primary-action" type="submit">更新邮箱</button>
            </form>
          </section>

          <section class="settings-section danger-zone" aria-labelledby="dangerTitle">
            <h2 id="dangerTitle">其他</h2>
            <button class="secondary-action" type="button" id="logoutButton">退出登录</button>
            <form id="deleteAccountForm">
              <h3>注销账号</h3>
              <label>
                <span>当前密码</span>
                <input name="password" type="password" autocomplete="current-password" required>
              </label>
              <label>
                <span>确认文字</span>
                <input name="confirmText" required placeholder="输入：注销账号">
              </label>
              <p class="settings-message" id="deleteStatus" aria-live="polite"></p>
              <button class="danger-action" type="submit">永久注销账号</button>
            </form>
          </section>
        </div>
      </section>

      <nav class="bottom-navigation" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-target="entertainment" aria-controls="entertainmentView" aria-current="page">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 12h4"></path><path d="M8 10v4"></path><path d="M15 13h.01"></path><path d="M18 11h.01"></path><path d="M7.5 5h9A4.5 4.5 0 0 1 21 9.5v5a3.5 3.5 0 0 1-6.1 2.35L13 15H11l-1.9 1.85A3.5 3.5 0 0 1 3 14.5v-5A4.5 4.5 0 0 1 7.5 5z"></path></svg>
          <span>娱乐</span>
        </button>
        <button class="nav-item" type="button" data-target="friends" aria-controls="friendsView">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>好友</span>
        </button>
        <button class="nav-item" type="button" data-target="profile" aria-controls="profileView">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>我的</span>
        </button>
      </nav>

      <p class="app-toast" id="appToast" role="status" aria-live="polite"></p>
    </main>
    <section class="zhao-game" id="zhaoGame" aria-label="赵云与阿斗游戏" hidden>
      <div class="zy-game-shell" id="zyGameShell"></div>
      <p class="zy-live" id="zyLive" role="status" aria-live="polite"></p>
    </section>
  </body>
</html>
