<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="登录深情俱乐部">
    <meta property="og:title" content="深情.club">
    <meta property="og:description" content="登录深情俱乐部">
    <meta property="og:type" content="website">
    <title>深情俱乐部</title>
    <link rel="stylesheet" href="styles.css?v=9">
    <script src="app.js?v=9" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  </head>
  <body>
    <main class="book-room">
      <div class="book-stage" id="bookStage" data-view="login">
        <div class="book" id="authBook">
          <section class="book-page" id="bookPage" aria-hidden="true">
            <div class="page-panel is-active" data-page="register">
              <button class="close-book" type="button" aria-label="返回登录页" data-close-book>
                <span aria-hidden="true">&larr;</span>
                <span>合上书本</span>
              </button>

              <header class="page-heading">
                <p>NEW MEMBER</p>
                <h2>注册账号</h2>
                <span>写下你的名字，从这里开始。</span>
              </header>

              <form class="page-form register-form" id="registerForm" autocomplete="on">
                <label class="page-field" for="registerUsername">
                  <span>账号</span>
                  <input id="registerUsername" name="username" type="text" autocomplete="username" required minlength="2" maxlength="24" placeholder="2-24 位字符">
                </label>

                <label class="page-field" for="registerPassword">
                  <span>密码</span>
                  <input id="registerPassword" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="至少 8 位字符">
                </label>

                <label class="page-field" for="confirmPassword">
                  <span>确认密码</span>
                  <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="再次输入密码">
                </label>

                <label class="page-field" for="registerEmail">
                  <span>邮箱</span>
                  <input id="registerEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="用于绑定账号">
                </label>

                <div class="email-code-row">
                  <label class="page-field" for="registerEmailCode">
                    <span>邮箱验证码</span>
                    <input id="registerEmailCode" name="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" required minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="6 位数字">
                  </label>
                  <button class="send-code-button" id="sendEmailCode" type="button">获取验证码</button>
                </div>

                <p class="form-message" id="registerMessage" aria-live="polite"></p>
                <button class="page-submit" id="registerSubmit" type="submit">完成注册</button>
              </form>
            </div>

            <div class="page-panel" data-page="recovery" hidden>
              <button class="close-book" type="button" aria-label="返回登录页" data-close-book>
                <span aria-hidden="true">&larr;</span>
                <span>合上书本</span>
              </button>

              <header class="page-heading recovery-heading">
                <p>RECOVERY</p>
                <h2>忘记密码</h2>
                <span>通过绑定邮箱重置登录密码。</span>
              </header>

              <form class="page-form recovery-form" id="recoveryForm" autocomplete="on">
                <label class="page-field" for="recoveryUsername">
                  <span>账号</span>
                  <input id="recoveryUsername" name="username" type="text" autocomplete="username" required minlength="2" maxlength="24" placeholder="输入注册账号">
                </label>

                <label class="page-field" for="recoveryEmail">
                  <span>邮箱</span>
                  <input id="recoveryEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="账号绑定邮箱">
                </label>

                <label class="page-field" for="recoveryPassword">
                  <span>新密码</span>
                  <input id="recoveryPassword" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="至少 8 位字符">
                </label>

                <label class="page-field" for="recoveryConfirmPassword">
                  <span>确认密码</span>
                  <input id="recoveryConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="再次输入密码">
                </label>

                <div class="email-code-row">
                  <label class="page-field" for="recoveryEmailCode">
                    <span>邮箱验证码</span>
                    <input id="recoveryEmailCode" name="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" required minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="6 位数字">
                  </label>
                  <button class="send-code-button" id="sendResetCode" type="button">获取验证码</button>
                </div>

                <p class="form-message" id="recoveryMessage" aria-live="polite"></p>
                <button class="page-submit" id="recoverySubmit" type="submit">重置密码</button>
              </form>
            </div>
          </section>

          <section class="book-cover" id="bookCover" aria-labelledby="loginTitle">
            <div class="cover-face cover-front">
              <div class="cover-content">
                <header class="cover-heading">
                  <h1 id="loginTitle">深情俱乐部</h1>
                  <span class="title-underline" aria-hidden="true"></span>
                  <p>输入账号密码以进入</p>
                </header>

                <form class="login-form" id="loginForm" autocomplete="on">
                  <label class="cover-field" for="loginUsername">
                    <span>账号：</span>
                    <input id="loginUsername" name="username" type="text" autocomplete="username" required minlength="2" maxlength="24" aria-label="账号">
                  </label>

                  <label class="cover-field" for="loginPassword">
                    <span>密码：</span>
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" aria-label="密码">
                  </label>

                  <p class="form-message cover-message" id="loginMessage" aria-live="polite"></p>
                  <button class="open-button" id="loginSubmit" type="submit">打开</button>
                </form>

                <nav class="cover-links" aria-label="账号帮助">
                  <button type="button" data-open-page="register">注册账号</button>
                  <span aria-hidden="true"></span>
                  <button type="button" data-open-page="recovery">忘记密码</button>
                </nav>
              </div>
            </div>
            <div class="cover-face cover-back" aria-hidden="true"></div>
          </section>
        </div>
      </div>
    </main>

    <div class="verification-modal" id="verificationModal" role="dialog" aria-modal="true" aria-labelledby="verificationTitle" hidden>
      <button class="verification-backdrop" type="button" aria-label="取消验证" data-close-verification></button>
      <section class="verification-dialog">
        <button class="verification-close" type="button" aria-label="关闭验证窗口" data-close-verification>&times;</button>
        <header>
          <p>SECURITY CHECK</p>
          <h2 id="verificationTitle">安全验证</h2>
        </header>
        <div id="turnstileWidget"></div>
        <p class="verification-message" id="verificationMessage" aria-live="polite">验证通过后将自动发送验证码</p>
      </section>
    </div>
  </body>
</html>
