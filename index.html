<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="登录深情.club">
    <meta property="og:title" content="深情.club">
    <meta property="og:description" content="登录深情.club">
    <meta property="og:type" content="website">
    <title>登录 · 深情.club</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="app.js?v=2" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="深情.club 登录页">
        <span class="brand-mark" aria-hidden="true">深</span>
        <span>深情.club</span>
      </a>
      <span class="site-status">PRIVATE SPACE</span>
    </header>

    <main class="auth-page">
      <p class="backdrop-word" aria-hidden="true">深情</p>

      <section class="auth-dialog" aria-labelledby="authTitle">
        <header class="dialog-heading">
          <p class="dialog-kicker">WELCOME</p>
          <h1 id="authTitle">登录</h1>
          <p id="authDescription">进入你的私人空间</p>
        </header>

        <div class="auth-tabs" role="tablist" aria-label="账号操作">
          <button class="auth-tab is-active" type="button" role="tab" aria-selected="true" data-auth-mode="login">登录</button>
          <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-mode="register">注册</button>
        </div>

        <form class="auth-form" id="authForm" autocomplete="on">
          <div class="form-field">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" autocomplete="username" required minlength="2" maxlength="24" placeholder="输入账号">
          </div>

          <div class="form-field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="至少 8 位字符">
          </div>

          <div class="form-field register-only is-hidden">
            <label for="confirmPassword">确认密码</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="再次输入密码">
          </div>

          <div class="turnstile-row register-only is-hidden">
            <span>人机验证</span>
            <div id="turnstileWidget"></div>
          </div>

          <p class="auth-message" id="authMessage" aria-live="polite"></p>
          <button class="auth-submit" type="submit">
            <span>进入</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="auth-note">账号由 Cloudflare 安全保存</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>深情.club</span>
      <span>2026</span>
    </footer>
  </body>
</html>
