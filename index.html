<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="深情.club">
    <meta property="og:title" content="深情.club">
    <meta property="og:description" content="深情.club">
    <meta property="og:image" content="assets/hero.png">
    <meta property="og:type" content="website">
    <title>深情.club</title>
    <link rel="preload" href="assets/hero.png" as="image">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body class="auth-loading">
    <section class="auth-view" aria-label="登录注册">
      <div class="gate">
        <div class="gate-media" aria-hidden="true">
          <img src="assets/hero.png" alt="">
        </div>

        <div class="gate-content">
          <header class="gate-header">
            <a class="gate-logo" href="/" aria-label="深情.club 首页">
              <span>深</span>
              <strong>深情.club</strong>
            </a>
            <p>private image room</p>
          </header>

          <div class="gate-statement">
            <p class="gate-label">access after dusk</p>
            <h1>晚风留给你。</h1>
          </div>

          <section class="gate-access" aria-label="账号访问">
            <div class="mode-switch" role="tablist" aria-label="账号">
              <button class="mode-button is-active" type="button" role="tab" aria-selected="true" data-auth-mode="login">登录</button>
              <button class="mode-button" type="button" role="tab" aria-selected="false" data-auth-mode="register">注册</button>
            </div>

            <form class="gate-form" id="authForm" autocomplete="on">
              <div class="field-row">
                <label for="username">账号</label>
                <input id="username" name="username" type="text" autocomplete="username" required minlength="2" maxlength="24" placeholder="name">
              </div>

              <div class="field-row">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="password">
              </div>

              <div class="field-row register-only is-hidden">
                <label for="confirmPassword">确认</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="repeat">
              </div>

              <button class="gate-submit" type="submit">进入</button>
            </form>

            <p class="gate-message" id="authMessage" aria-live="polite"></p>
          </section>
        </div>
      </div>
    </section>

    <main class="app-view" aria-label="深情.club">
      <div class="app-bar">
        <span id="currentUser"></span>
        <button type="button" id="logoutButton">退出</button>
      </div>
      <img src="assets/hero.png" alt="暮色海岸与山路" width="1672" height="941">
    </main>
  </body>
</html>
